name: Deploy Hugo Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.159.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          wget -q -O hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf hugo.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Build
        run: hugo --minify

      # 搜索索引：扫描构建产物生成分片索引，按需懒加载（只有 /search/ 会拉）
      - name: Build search index
        run: npx --yes pagefind@1.5.2 --site public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 邮件订阅：这次 push 新增的简报，部署完成后给 Buttondown 订阅者发摘要 + 链接
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify subscribers of new briefs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          NEW=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.sha }} 2>/dev/null \
            | grep -E '^content/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)
          if [ -z "$NEW" ]; then echo "本次 push 没有新增简报，跳过"; exit 0; fi
          for F in $NEW; do
            python3 scripts/notify_subscribers.py --kind daily --file "$F" \
              --base-url https://luoli523.github.io/guige-ai-site
          done
