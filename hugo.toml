baseURL = 'https://luoli523.github.io/guige-ai-site/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = '鬼哥的 AI 行业动态'
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true   # 中文按字数统计，否则 ReadingTime 会严重低估
timeZone = 'Asia/Singapore'

[pagination]
  pagerSize = 15

[permalinks]
  daily = '/daily/:year-:month-:day/'

[params]
  description = '每日 AI 行业与技术深读，自动采集、交叉核实、每日更新。'
  subtitle = "Gui Ge's AI Radar"
  mainSite = 'https://luoli523.github.io/'
  repo = 'https://github.com/luoli523/guige-ai-site'

  # 评论 / 浏览量：与主站共用同一个 Waline 后端，按 URL 路径区分
  [params.comments.waline]
    serverURL = 'https://waline-server-amber.vercel.app'

  # 访问统计：与主站同一 hostname，共用同一个 Cloudflare Web Analytics token
  [params.analytics.cloudflare]
    token = '6aaf83fc05e244f88ca89346fb1acdcb'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'github-dark'
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
