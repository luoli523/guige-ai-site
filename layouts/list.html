{{ define "main" }}
<div class="wrap">
  <header class="page-head reveal">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-desc">{{ . }}</p>{{ end }}
  </header>

  <section class="section">
    <div class="brief-list reveal-stagger">
      {{ range .Pages }}
        {{ partial "brief-card.html" (dict "page" . "latest" false) }}
      {{ end }}
    </div>
  </section>
</div>

{{/* 卡片浏览量：只读拉取，不计数 */}}
<script type="module">
  import { pageviewCount } from 'https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/pageview.js';
  pageviewCount({ serverURL: '{{ .Site.Params.comments.waline.serverURL }}', update: false });
</script>
{{ end }}
