{{/* 鬼哥对话气泡 —— 与主站同款，接同一个 avatar API */}}

<div class="chat-hint" id="chatHint" role="button" tabindex="0">
  <span class="hint-text">跟鬼哥聊聊 AI</span>
  <span class="arrow" aria-hidden="true">→</span>
</div>

<button class="chat-fab" id="chatFab" aria-label="跟鬼哥聊天">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>

<div class="chat-panel" id="chatPanel" role="dialog" aria-label="跟鬼哥聊天">
  <div class="chat-header">
    <img class="chat-header-avatar" src="{{ "img/avatar-face.png" | relURL }}" alt="鬼哥" width="30" height="30" />
    <span class="chat-header-name">鬼哥</span>
    <span class="chat-header-status">在线</span>
    <button class="chat-close" id="chatClose" aria-label="关闭聊天">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <input class="chat-input" id="chatInput" type="text" placeholder="说点什么..." maxlength="500" autocomplete="off" />
    <button class="chat-send" id="chatSend">发送</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const API_URL = 'https://guige-avatar.vercel.app/api/chat';

  const welcome = {
    zh: '嗯，有什么想聊的？今天的 AI 要闻、技术、或者随便扯扯都行 😄',
    en: 'Hey! Wanna chat about today’s AI news, tech, or anything? Fire away 😄',
  };

  // 提示语随机轮换
  const HINTS = [
    '跟鬼哥聊聊 AI',
    '今天这几条，想问点什么？',
    '有看不懂的？问鬼哥',
    '鬼哥在线，随便聊',
    '想知道鬼哥怎么看？',
  ];

  const MAX_HINTS   = 3;      // 每次会话最多提示几次
  const FIRST_DELAY = [8000, 20000];   // 首次提示的随机延迟区间
  const GAP         = [50000, 110000]; // 之后两次提示的随机间隔
  const VISIBLE     = 6000;   // 每次显示时长

  const fab      = document.getElementById('chatFab');
  const panel    = document.getElementById('chatPanel');
  const closeBtn = document.getElementById('chatClose');
  const messages = document.getElementById('chatMessages');
  const input    = document.getElementById('chatInput');
  const sendBtn  = document.getElementById('chatSend');
  const hint     = document.getElementById('chatHint');
  const hintText = hint.querySelector('.hint-text');

  const history = [];
  let isWaiting = false;
  let welcomed  = false;
  let hintTimer = null;
  // 提示次数跨页面累计，避免每翻一页都被提示 3 次
  let hintsShown = parseInt(sessionStorage.getItem('gg-chat-hint-count') || '0', 10);
  let hintsDone  = sessionStorage.getItem('gg-chat-hint-done') === '1' || hintsShown >= MAX_HINTS;

  const rand = ([lo, hi]) => lo + Math.random() * (hi - lo);

  function showHint() {
    if (hintsDone || panel.classList.contains('open') || document.hidden) {
      return scheduleHint();
    }
    hintText.textContent = HINTS[Math.floor(Math.random() * HINTS.length)];
    hint.classList.add('show');
    fab.classList.add('nudge');
    hintsShown++;
    sessionStorage.setItem('gg-chat-hint-count', String(hintsShown));

    setTimeout(() => {
      hint.classList.remove('show');
      fab.classList.remove('nudge');
      if (hintsShown >= MAX_HINTS) stopHints();
      else scheduleHint();
    }, VISIBLE);
  }

  function scheduleHint() {
    if (hintsDone) return;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(showHint, rand(hintsShown === 0 ? FIRST_DELAY : GAP));
  }

  // 用户点开过聊天就不再骚扰（整个会话内）
  function stopHints() {
    hintsDone = true;
    clearTimeout(hintTimer);
    hint.classList.remove('show');
    fab.classList.remove('nudge');
    sessionStorage.setItem('gg-chat-hint-done', '1');
  }

  scheduleHint();

  const detectLang = () =>
    (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'chat-typing';
    div.id = 'chatTyping';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('chatTyping');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isWaiting) return;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    input.value = '';
    isWaiting = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(-10), lang: detectLang() }),
      });

      hideTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage(err.error || '鬼哥走神了，请稍后再试', 'bot');
        return;
      }

      const data = await res.json();
      addMessage(data.reply, 'bot');
      history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      hideTyping();
      addMessage('网络好像不太行，过一会再试试？', 'bot');
    } finally {
      isWaiting = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function openChat() {
    panel.classList.add('open');
    fab.classList.add('hidden');
    stopHints();
    if (!welcomed) {
      addMessage(welcome[detectLang()] || welcome.zh, 'bot');
      welcomed = true;
    }
    input.focus();
  }

  function closeChat() {
    panel.classList.remove('open');
    fab.classList.remove('hidden');
  }

  fab.addEventListener('click', openChat);
  hint.addEventListener('click', openChat);
  hint.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChat(); }
  });
  closeBtn.addEventListener('click', closeChat);

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && panel.classList.contains('open')) closeChat();
  });
})();
</script>
